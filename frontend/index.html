<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nativestudio</title>
    <link rel="stylesheet" href="style.css">
    <script>var require = { paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' } };</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.js"></script>
</head>
<body>
    <header>
        <div class="brand">nativestudio</div>
        <div class="header-controls">
            <select id="model-select">
                <option value="codellama">codellama</option>
            </select>
            <div class="context-bar">
                <span>Context:</span>
                <div class="progress-container">
                    <div id="context-progress" class="progress-fill" style="background-color: var(--green);"></div>
                </div>
                <span id="context-pct">0%</span>
                <span id="context-zone" class="zone-label" style="color: var(--green);">Green</span>
                <button class="secondary" id="reset-btn">Reset</button>
            </div>
        </div>
    </header>
    
    <div class="main-content">
        <div id="file-tree-panel">
            <div style="margin-bottom: 10px; padding: 0 10px; border-bottom: 1px solid var(--border); padding-bottom: 10px;">
                <button id="btn-open-folder" class="secondary" style="width: 100%; box-sizing: border-box;">Open Folder...</button>
            </div>
            <div id="file-tree-content"></div>
        </div>
        
        <div id="editor-panel">
            <div id="monaco-container"></div>
            <div class="status-bar">
                <span id="status-path">No file open</span>
                <span id="status-unsaved" style="display: none; color: var(--yellow);">● Unsaved (Ctrl+S to save)</span>
            </div>
        </div>
        
        <div id="chat-panel">
            <div class="chat-messages" id="chat-messages">
                <div class="msg system">Welcome to nativestudio. Connected to Ollama.</div>
            </div>
            <div class="chat-input-area">
                <label class="checkbox-label">
                    <input type="checkbox" id="send-file-chk"> Include active file
                </label>
                <textarea id="chat-input" placeholder="Ask a question (Ctrl+Enter to send)..."></textarea>
                <div class="chat-controls">
                    <div class="loading-spinner" id="chat-spinner"></div>
                    <button id="send-btn">Send</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="editor.js"></script>
    <script src="chat.js"></script>
</body>
</html>
